[project]
name = "miniverse-control-plane"
version = "0.1.0"
description = "Miniverse multi-agent control plane using Microsoft Agent Framework and OpenHands"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-framework==1.18.0",
  "openhands-sdk==1.47.0",
  "openhands-tools==1.47.0",
  "litellm==1.100.1",
  "python-dotenv>=1.0.1,<2",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
