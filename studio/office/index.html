<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AHOS Sanal Ofis</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mut:#6b7385;--ac:#e8590c;--ok:#2b9348;--bad:#c92a2a;--ln:#e3ddd0}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--card:#202634;--ink:#eef0f5;--mut:#98a0b3;--ln:#2e3648}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
h1{font-size:19px;margin:0;flex:1}h2{font-size:15px;margin:0 0 10px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;padding:16px 20px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}.wide{grid-column:1/-1}
textarea,input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}button.s{background:var(--ln);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--ln)}
.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.on{background:var(--ok);color:#fff;border-color:var(--ok)}.off{color:var(--mut)}
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.w{border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:13px}.w b{display:block}.w.act{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.w small{color:var(--mut)}
.job{padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}.job:last-child{border:0}
.st-pending{color:var(--mut)}.st-running{color:var(--ac)}.st-done{color:var(--ok)}.st-failed{color:var(--bad)}
pre{white-space:pre-wrap;font-size:12px;color:var(--mut);margin:0}video{width:100%;border-radius:8px;background:#000}
.les{font-size:13px;padding:4px 0}.own{color:var(--ac);font-weight:600}
</style></head><body>
<header><h1>🎬 AHOS Sanal Ofis</h1><span id="dm" class="pill"></span><button class="s" onclick="dm('start')">Stüdyoyu aç</button><button class="s" onclick="dm('stop')">Kapat</button></header>
<main>
<section class="card wide"><h2>Komut ver</h2>
<textarea id="cmd" rows="3" placeholder="Örn: Bulut Bahçesi dizisi için 8 dakikalık yeni bölüm yap: iki çocuk kayıp bir kediyi arıyor"></textarea>
<div class="row"><input id="ser" placeholder="Dizi kodu (boşsa yeni dizi)"><select id="rs"><option value="12">Hızlı test (12 sn render)</option><option value="30">30 sn render</option><option value="-1">Tüm bölüm (8 dk)</option><option value="0">Sadece senaryo+ses</option></select><button onclick="send()">Gönder</button></div>
<div id="msg" style="margin-top:6px;color:var(--mut)"></div></section>
<section class="card wide"><h2>Çalışanlar</h2><div id="workers" class="workers"></div></section>
<section class="card"><h2>İş kuyruğu</h2><div id="jobs"></div><h2 style="margin-top:14px">Canlı kayıt</h2><pre id="log"></pre></section>
<section class="card"><h2>Videolar</h2><select id="vsel" onchange="play()"></select><video id="vid" controls style="margin-top:8px"></video></section>
<section class="card"><h2>Çalışanlara öğret</h2>
<select id="fw"><option value="writer">Senaryo yazarı</option><option value="critic">Eleştirmen</option></select>
<textarea id="ft" rows="2" style="margin-top:8px" placeholder="Örn: Replikler kısa ve günlük konuşma gibi olsun"></textarea>
<div class="row"><button onclick="fb()">Kalıcı ders olarak kaydet</button></div><div id="les" style="margin-top:10px"></div></section>
<section class="card"><h2>Gelişim raporu</h2><pre id="rep" style="color:var(--ink)"></pre><div class="row"><button class="s" onclick="rep()">Yenile</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function send(){const c=$('cmd').value.trim();if(!c)return;const r=await api('/api/command',{command:c,series_id:$('ser').value.trim(),render_seconds:+$('rs').value});$('msg').textContent=r.ok?'Kuyruğa eklendi ('+r.id+'). Stüdyo: '+r.daemon:(r.error||'hata');if(r.ok)$('cmd').value='';load()}
async function dm(d){const r=await api('/api/daemon',{do:d});$('msg').textContent=r.msg;load()}
async function fb(){const t=$('ft').value.trim();if(!t)return;await api('/api/feedback',{worker:$('fw').value,text:t});$('ft').value='';load()}
async function ret(w,t){await api('/api/retire',{worker:w,text:t});load()}
async function rep(){const r=await api('/api/report');$('rep').textContent=r.text}
let cur='';function play(){const p=$('vsel').value;if(p&&p!==cur){cur=p;$('vid').src='/video/'+p.split('/').map(encodeURIComponent).join('/')}}
async function load(){const s=await api('/api/status');
$('dm').textContent='Stüdyo: '+s.daemon.state;$('dm').className='pill '+(s.daemon.alive?'on':'off');
const L={off:['bağlı değil','off'],ready:['hazır',''],active:['çalışıyor','on'],done:['bitti ✓','on'],waiting:['sırada','off'],failed:['hata','bad']};
$('workers').innerHTML=s.workers.map(w=>{const l=L[w.state]||L.ready;return `<div class="w ${w.state=='active'?'act':''}"><b>${esc(w.name)}</b><small>${esc(w.role)}</small><br><span class="pill ${l[1]}">${l[0]}</span></div>`}).join('');
const n={pending:'sırada',running:'çalışıyor',done:'bitti',failed:'hata'};
$('jobs').innerHTML=s.jobs.slice().reverse().map(j=>`<div class="job"><span class="st-${j.state}">● ${n[j.state]}</span> ${esc(j.command.slice(0,90))}${j.error?'<br><small>'+esc(j.error)+'</small>':''}</div>`).join('')||'<small>İş yok</small>';
$('log').textContent=s.log;
const v=$('vsel'),old=v.value;v.innerHTML=s.videos.map(x=>`<option value="${esc(x.path)}">${esc(x.when)} — ${esc(x.path)}</option>`).join('');if(old)v.value=old;play();
$('les').innerHTML=['writer','critic'].map(w=>s.lessons[w].map(l=>`<div class="les ${l.owner?'own':''}">${l.owner?'★ ':''}${esc(l.t)} <a href="#" onclick="ret('${w}',${esc(JSON.stringify(l.t.slice(0,25))).replace(/'/g,'')});return false" title="sil">✕</a></div>`).join('')).join('')||'<small>Henüz ders yok</small>'}
load();rep();setInterval(load,5000);
</script></body></html>
