<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AHOS Çizgi Film Stüdyosu — Ofis</title>
<style>
:root{
  --bg:#efe7da; --ink:#2a2420; --muted:#6f655b; --card:#fbf7f0; --line:#d9cdbb;
  --wood:#c9a37a; --wood2:#b58a60; --accent:#d8572a;
}
@media (prefers-color-scheme: dark){:root{--bg:#1d1916;--ink:#f1e9de;--muted:#b3a799;--card:#2a2420;--line:#4a4036;--wood:#7a5a3d;--wood2:#654a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.2px}
header .sp{flex:1}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--bg)}
.pill.on{background:#e3f4ea;border-color:#9ad0b1;color:#14663a}
.pill.off{background:#f7e3e3;border-color:#dba3a3;color:#8c2323}
@media (prefers-color-scheme: dark){.pill.on{background:#16382a;color:#9fe3bd}.pill.off{background:#3c1f1f;color:#f0a9a9}}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.05)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.room{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.room h3{margin:0;padding:9px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.room h3 small{color:var(--muted);font-weight:400}
.room .rm{padding:12px 8px 14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  background:repeating-linear-gradient(90deg,var(--wood) 0 38px,var(--wood2) 38px 40px);background-blend-mode:multiply}
.desk{width:140px;text-align:center;position:relative}
.desk .bubble{position:absolute;left:50%;transform:translateX(-50%);top:-6px;max-width:150px;background:#fff;color:#222;border-radius:10px;padding:3px 8px;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:3;pointer-events:none}
.desk.active .bubble,.desk.failed .bubble,.desk:hover .bubble{opacity:1}
.desk svg.person{width:96px;height:112px;display:block;margin:6px auto -26px;position:relative;z-index:2}
.desk .table{height:58px;border-radius:8px 8px 4px 4px;background:linear-gradient(#e8d3b6,#d2b48f);border:1px solid #a98558;position:relative;z-index:1}
.desk .mon{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:44px;height:26px;border-radius:3px;background:#1b2630;border:2px solid #3a4651}
.desk.active .mon{background:linear-gradient(135deg,#3b8bd9,#7fd3a8);animation:glow 1.1s infinite alternate}
.desk.failed .mon{background:#c43a3a}
.desk.done .mon{background:#2f8f5b}
.desk.waiting .mon{background:#51493f}
@keyframes glow{from{filter:brightness(.8)}to{filter:brightness(1.3)}}
.desk.active .hands{animation:type .35s infinite alternate}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(3px)}}
.desk.failed svg.person{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.blink{animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.desk .nm{font-weight:600;font-size:12.5px;line-height:1.2;margin-top:3px}
.desk .rl{font-size:11px;color:var(--muted);line-height:1.25;min-height:28px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;margin-top:2px;border:1px solid var(--line);background:var(--bg)}
.chip.active{background:#dceaf9;color:#174c85;border-color:#9dc1ea}.chip.done{background:#e3f4ea;color:#14663a;border-color:#9ad0b1}
.chip.failed{background:#f7e3e3;color:#8c2323;border-color:#dba3a3}.chip.waiting{background:#f6efd9;color:#7a5b0b;border-color:#e2cf94}
.chip.off{opacity:.6}
aside .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
aside h2{font-size:15px;margin:0 0 8px}
input,select,textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.job{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.job span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);border-radius:8px;padding:8px;max-height:170px;overflow:auto;margin:6px 0 0}
video{width:100%;border-radius:10px;background:#000}
.note{font-size:12px;color:var(--muted)}
.vl button{margin:3px 4px 0 0;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AHOS Çizgi Film Stüdyosu</h1>
  <span id="dm" class="pill off">stüdyo kapalı</span>
  <span class="sp"></span>
  <button onclick="dm('start')" class="primary">Stüdyoyu aç</button>
  <button onclick="dm('stop')">Kapat</button>
</header>
<main>
  <section>
    <div id="floor" class="floor"></div>
    <p class="note">Çalışanlar yapay zekâ ajanlarıdır; resimler çizimdir, gerçek kişi değildir. Üstüne gelince görevlerini görürsün. Yaratıcı onay yalnız sahibindedir (sende).</p>
  </section>
  <aside>
    <div class="box">
      <h2>Yeni iş ver</h2>
      <textarea id="cmd" rows="3" placeholder="Örn: Merhaba, Bizim Aile! yeni bölüm: park kuralları"></textarea>
      <div class="row"><input id="ser" placeholder="dizi kodu (örn. ahos-bizim-aile)"><input id="rs" type="number" value="30" title="çizilecek saniye (-1 = tüm bölüm)"></div>
      <button class="primary" onclick="send()">Kuyruğa ekle</button> <span id="msg" class="note"></span>
    </div>
    <div class="box"><h2>Sinema odası</h2><video id="vid" controls></video><div id="vl" class="vl"></div></div>
    <div class="box"><h2>Kuyruk</h2><div id="jobs"></div><pre id="log"></pre></div>
    <div class="box">
      <h2>Yazarlara geri bildirim</h2>
      <select id="fw"><option value="writer">Yazar</option><option value="critic">Eleştirmen</option></select>
      <textarea id="ft" rows="2" placeholder="Ne düzelsin? (örn. replikler kısa olsun)"></textarea>
      <button onclick="fb()">Gönder</button>
      <button onclick="rep()">Son raporu göster</button><pre id="rep"></pre>
    </div>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id);
const ROOMS=[
 {n:'Yönetim',s:'komut ve plan',w:['showrunner','director']},
 {n:'Senaryo Odası',s:'yaz, eleştir, zenginleştir',w:['writers_room','validator','script_enrich']},
 {n:'Sanat ve Animasyon',s:'karakter, çizim, efekt',w:['character','render','fx_layer','animatic']},
 {n:'Ses Stüdyosu',s:'kayıt, dudak, dublaj',w:['voice','audio_polish','localisation']},
 {n:'Müzik Odası',s:'tema, efekt sesi',w:['music_sfx','score_engine']},
 {n:'Kalite Salonu',s:'izle, ölç, denetle',w:['video_qa','standards','agent_doctor']},
 {n:'Hukuk, Para, Yayın',s:'lisans, bütçe, dağıtım',w:['rights','finance','distribution','analytics']},
 {n:'Kütüphane',s:'araştırma ve gözlem',w:['research','task_observer']}
];
const LOOK={
 showrunner:{sk:'#e6b996',h:'#2d2018',hs:'long',g:1,o:'#2f3e5c'}, director:{sk:'#d9a47c',h:'#1e1712',hs:'short',b:'full',o:'#6a2c2c'},
 writers_room:{sk:'#efc9a8',h:'#6b2e4a',hs:'hijab',o:'#e8dcc8'}, validator:{sk:'#e9c4a0',h:'#b9b3ab',hs:'short',g:1,o:'#3c5a49'},
 voice:{sk:'#c38d66',h:'#16110d',hs:'short',hp:1,o:'#c9892b'}, localisation:{sk:'#f0cfae',h:'#4a2c1f',hs:'wavy',hp:1,o:'#3e7d7a'},
 animatic:{sk:'#e2b38b',h:'#34241a',hs:'short',o:'#5b5b9c'}, character:{sk:'#f3d3b7',h:'#7a3b22',hs:'bun',o:'#b0506b'},
 render:{sk:'#d49d74',h:'#1c140f',hs:'short',b:'stub',o:'#3a3a3a'}, video_qa:{sk:'#e5b690',h:'#241a14',hs:'long',g:1,o:'#4b7ab3'},
 music_sfx:{sk:'#8d5a3b',h:'#0f0b09',hs:'curly',hp:1,o:'#8a3f2b'}, rights:{sk:'#f0c9a4',h:'#a3764b',hs:'long',o:'#2c2c44'},
 finance:{sk:'#d8a67e',h:'#2b2018',hs:'short',g:1,b:'stub',o:'#44504a'}, research:{sk:'#e8bf9b',h:'#3d2b21',hs:'wavy',g:1,o:'#9c6b2f'},
 analytics:{sk:'#c9946b',h:'#1b1410',hs:'short',o:'#2d5a7b'}, distribution:{sk:'#f1d0b1',h:'#2a1c15',hs:'hijab',o:'#7aa392'},
 task_observer:{sk:'#e0ae86',h:'#222222',hs:'bald',b:'full',g:1,o:'#6b6b6b'}, agent_doctor:{sk:'#ecc7a4',h:'#4b2a20',hs:'bun',o:'#f2f2f0'},
 score_engine:{sk:'#b87c55',h:'#150f0c',hs:'curly',hp:1,o:'#2e5b45'}, fx_layer:{sk:'#f2d2b6',h:'#8c3a2a',hs:'wavy',o:'#7b4aa0'},
 audio_polish:{sk:'#dba982',h:'#2a1d16',hs:'short',hp:1,o:'#3a4d63'}, script_enrich:{sk:'#e7bf9b',h:'#2e2030',hs:'hijab',o:'#a8663a'},
 standards:{sk:'#d5a07a',h:'#4a4a4a',hs:'short',g:1,b:'stub',o:'#304a6b'}
};
function shade(c,k){const n=parseInt(c.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;[r,g,b]=[r,g,b].map(v=>Math.max(0,Math.min(255,v*k)));return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function person(id,uid){
  const L=LOOK[id]||{sk:'#e2b38b',h:'#2a1c15',hs:'short',o:'#556'}, sk=L.sk, h=L.h, o=L.o, u='p'+uid;
  let back='',acc='';
  if(L.hs==='long')back=`<path d="M24 52 C20 100 22 112 30 118 L70 118 C78 112 80 100 76 52 Z" fill="${h}"/>`;
  if(L.hs==='wavy')back=`<path d="M24 50 C16 80 28 92 22 116 L40 112 L50 118 L62 112 L78 116 C72 92 84 80 76 50 Z" fill="${h}"/>`;
  if(L.hs==='hijab')back=`<path d="M22 46 C14 70 16 104 28 118 L72 118 C84 104 86 70 78 46 C74 24 26 24 22 46 Z" fill="${h}"/>`;
  if(L.hs==='curly')back=`<g fill="${h}">${[[26,40],[22,52],[24,64],[74,40],[78,52],[76,64],[34,26],[50,22],[66,26]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="10"/>`).join('')}</g>`;
  if(L.hs==='bun')back=`<circle cx="50" cy="16" r="10" fill="${h}"/>`;
  const body=`<path d="M6 120 C8 98 24 90 38 86 L62 86 C76 90 92 98 94 120 Z" fill="${o}"/><path d="M38 86 L50 100 L62 86 Z" fill="${shade(o,.78)}"/>`;
  const neck=`<rect x="43" y="70" width="14" height="18" rx="5" fill="${shade(sk,.88)}"/>`;
  const head=`<ellipse cx="50" cy="50" rx="19.5" ry="24" fill="url(#g${u})"/><ellipse cx="30.8" cy="52" rx="3.2" ry="5.2" fill="${shade(sk,.94)}"/><ellipse cx="69.2" cy="52" rx="3.2" ry="5.2" fill="${shade(sk,.94)}"/>`;
  let hair='';
  if(L.hs==='short'||L.hs==='bun')hair=`<path d="M30 46 C28 22 44 18 52 19 C68 19 72 34 70 46 C66 36 58 32 50 32 C42 32 34 36 30 46 Z" fill="${h}"/>`;
  if(L.hs==='long'||L.hs==='wavy')hair=`<path d="M29 52 C24 24 42 17 52 18 C70 18 76 36 71 52 C68 38 60 32 50 32 C40 32 32 38 29 52 Z" fill="${h}"/>`;
  if(L.hs==='curly')hair=`<g fill="${h}">${[[32,34],[40,26],[50,24],[60,26],[68,34],[30,44],[70,44]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8"/>`).join('')}</g>`;
  if(L.hs==='hijab')hair=`<path d="M28 54 C24 20 76 20 72 54 C68 40 60 34 50 34 C40 34 32 40 28 54 Z" fill="${h}"/><path d="M30 78 C34 94 42 98 50 98 C58 98 66 94 70 78 C66 86 58 90 50 90 C42 90 34 86 30 78 Z" fill="${shade(h,.9)}"/>`;
  const bc=shade(h,.9);
  const eyes=`<g class="blink" style="transform-origin:50px 48px"><ellipse cx="42" cy="48" rx="3.6" ry="2.4" fill="#fff"/><ellipse cx="58" cy="48" rx="3.6" ry="2.4" fill="#fff"/><circle cx="42.4" cy="48" r="1.9" fill="#3b2a1f"/><circle cx="58.4" cy="48" r="1.9" fill="#3b2a1f"/><circle cx="43" cy="47.4" r=".6" fill="#fff"/><circle cx="59" cy="47.4" r=".6" fill="#fff"/></g>`;
  const brows=`<path d="M37.5 43 Q42 40.5 46.5 43" stroke="${bc}" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M53.5 43 Q58 40.5 62.5 43" stroke="${bc}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const nose=`<path d="M50 49 Q47.6 56 50 59 Q52 60 53.2 58.6" stroke="${shade(sk,.7)}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  const mouth=`<path d="M44.5 65 Q50 68.6 55.5 65" stroke="#8e4a45" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  const cheeks=`<ellipse cx="38" cy="60" rx="4.4" ry="2.6" fill="#e58e86" opacity=".28"/><ellipse cx="62" cy="60" rx="4.4" ry="2.6" fill="#e58e86" opacity=".28"/>`;
  let beard='';
  if(L.b==='stub')beard=`<path d="M32 56 C34 72 42 76 50 76 C58 76 66 72 68 56 C64 64 58 66 50 66 C42 66 36 64 32 56 Z" fill="${h}" opacity=".42"/>`;
  if(L.b==='full')beard=`<path d="M31 54 C32 78 42 84 50 84 C58 84 68 78 69 54 C65 64 58 62 50 62 C42 62 35 64 31 54 Z" fill="${bc}" opacity=".92"/><path d="M44 66 Q50 69 56 66" stroke="#8e4a45" stroke-width="1.5" fill="none"/>`;
  if(L.g)acc+=`<g stroke="#2a2a2a" stroke-width="1.4" fill="rgba(255,255,255,.14)"><rect x="35" y="43.5" width="14" height="10" rx="3.5"/><rect x="51" y="43.5" width="14" height="10" rx="3.5"/><path d="M49 48 H51"/></g>`;
  if(L.hp)acc+=`<path d="M29 50 C28 20 72 20 71 50" stroke="#222" stroke-width="3" fill="none"/><rect x="26" y="46" width="7" height="12" rx="3" fill="#222"/><rect x="67" y="46" width="7" height="12" rx="3" fill="#222"/><path d="M30 60 Q34 70 42 69" stroke="#222" stroke-width="1.6" fill="none"/><circle cx="43" cy="69" r="2" fill="#222"/>`;
  const hands=`<g class="hands"><ellipse cx="30" cy="116" rx="9" ry="5" fill="${sk}"/><ellipse cx="70" cy="116" rx="9" ry="5" fill="${sk}"/></g>`;
  return `<svg class="person" viewBox="0 0 100 124" aria-hidden="true"><defs><radialGradient id="g${u}" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="${shade(sk,1.07)}"/><stop offset="1" stop-color="${shade(sk,.86)}"/></radialGradient></defs>${back}${neck}${body}${head}${hair}${beard}${eyes}${brows}${nose}${mouth}${cheeks}${acc}${hands}</svg>`;
}
function chipText(s){return {active:'çalışıyor',waiting:'sırada',done:'bitti',failed:'sorun var',ready:'hazır',off:'bağlı değil'}[s]||s}
function renderFloor(ws){
  const by={};ws.forEach(w=>by[w.id]=w);
  let html='',n=0;
  ROOMS.forEach(r=>{
    html+=`<div class="room"><h3>${r.n}<small>${r.s}</small></h3><div class="rm">`;
    r.w.forEach(id=>{const w=by[id];if(!w)return;n++;
      html+=`<div class="desk ${w.state}" title="${w.role}"><div class="bubble">${w.role}</div>${person(id,n)}<div class="table"><div class="mon"></div></div><div class="nm">${w.name}</div><div class="rl">${w.role}</div><span class="chip ${w.state}">${chipText(w.state)}</span></div>`;});
    html+='</div></div>';
  });
  $('floor').innerHTML=html;
}
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json()}
async function send(){const c=$('cmd').value.trim();if(!c)return;const r=await api('/api/command',{command:c,series_id:$('ser').value.trim(),render_seconds:+$('rs').value});$('msg').textContent=r.ok?'Kuyruğa eklendi ('+r.id+'). Stüdyo: '+r.daemon:(r.error||'hata');if(r.ok)$('cmd').value='';load()}
async function dm(d){const r=await api('/api/daemon',{do:d});$('msg').textContent=r.msg;load()}
async function fb(){const t=$('ft').value.trim();if(!t)return;await api('/api/feedback',{worker:$('fw').value,text:t});$('ft').value='';load()}
async function rep(){const r=await api('/api/report');$('rep').textContent=r.text}
function play(p){const v=$('vid');v.src='/video/'+encodeURI(p);v.play&&v.play().catch(()=>{})}
let lastWorkers='';
async function load(){
  let s;try{s=await api('/api/status')}catch(e){$('dm').className='pill off';$('dm').textContent='ofis sunucusu yok';return}
  $('dm').className='pill '+(s.daemon.alive?'on':'off');$('dm').textContent='stüdyo: '+s.daemon.state;
  const sig=JSON.stringify(s.workers.map(w=>w.id+w.state));if(sig!==lastWorkers){lastWorkers=sig;renderFloor(s.workers)}
  $('jobs').innerHTML=s.jobs.slice(-8).reverse().map(j=>`<div class="job"><span>${(j.command||j.id).slice(0,40)}</span><span>${j.state}</span></div>`).join('')||'<span class="note">iş yok</span>';
  $('log').textContent=s.log||'';
  $('vl').innerHTML=s.videos.slice(0,6).map(v=>`<button onclick="play('${v.path.replace(/'/g,"\\'")}')">${v.when}</button>`).join('');
}
load();setInterval(load,4000);
</script>
</body>
</html>
