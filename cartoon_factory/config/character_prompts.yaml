style_lock:
  positive: >-
    premium 2D children's TV animation, clean vector-like linework, soft cel shading,
    expressive readable face, appealing silhouette, consistent proportions, full-body,
    production character sheet quality, original design, child-safe, polished, simple shapes,
    reusable animation asset, transparent background
  negative: >-
    photorealistic, 3D render, anime imitation, copyrighted character, text, watermark,
    extra fingers, extra limbs, malformed hands, asymmetrical eyes, distorted face,
    inconsistent clothes, inconsistent colors, noisy background, painterly texture
  consistency_rules:
    - "Do not change hair shape, eye color, outfit, shoes, body proportions or signature accessories."
    - "Keep exact palette from assets.yaml."
    - "Keep head-to-body ratio identical across every generated pose."
    - "All pose sheets must be generated from the approved front reference image."

