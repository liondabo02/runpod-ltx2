style_lock:
  positive: >-
    premium original 2D children's TV animation, clean vector-like linework, soft cel shading,
    expressive readable face, appealing silhouette, consistent proportions, full-body,
    production character sheet quality, child-safe, polished, simple reusable shapes,
    warm family-comedy tone, transparent background
  negative: >-
    photorealistic, 3D render, anime imitation, copyrighted character, text, watermark,
    extra fingers, extra limbs, malformed hands, asymmetrical eyes, distorted face,
    inconsistent clothes, inconsistent colors, noisy background, painterly texture,
    uncanny realism, harsh horror expression
  consistency_rules:
    - "Never redesign an approved recurring character."
    - "Keep exact face geometry, hairstyle/head covering, body proportions and signature silhouette."
    - "Use the approved reference sheet as the primary identity source for every new pose."
    - "Clothing may only vary through explicitly approved wardrobe variants."
    - "Babies and toddlers must preserve age-appropriate proportions in every pose."

