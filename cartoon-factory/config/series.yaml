series:
  title: "Untitled Kids Series"
  language: tr
  episode_minutes: 8
  target_age: "5-8"
  style: "premium 2D children's cartoon, clean bold line art, soft cinematic shading, expressive faces, polished TV-animation look, bright balanced palette, no photorealism"
  fps: 24
  resolution: [1920, 1080]
  max_scene_seconds: 12
  locked_cast: true
  locked_character_count: 16
  visual_style:
    master_prompt: "premium 2D children's cartoon, clean bold line art, soft cinematic shading, expressive faces, appealing child-friendly proportions, consistent reusable character model sheets, polished TV animation look, bright but balanced palette, no photorealism"
    consistency_priority: very_high
    character_redesign_allowed: false
    face_changes_allowed: false
    body_proportion_changes_allowed: false
    hairstyle_changes_allowed: false
    identity_palette_changes_allowed: false
    wardrobe_changes_allowed: controlled
    temporary_accessories_allowed: true
  narrative_core:
    household: "Harun and Esma's home"
    residents: [harun, esma, esra, aden, kaan]
    dominant_character: harun
    child_leads: [aden, kaan]
    father_presence_rule: "Ahmet is Aden and Kaan's father but does not live in the main household; he normally appears about once per week or in story-appropriate family visits."
    harun_story_function: "Harun is the most anticipated and beloved adult character, naturally gathers everyone, restores hope, solves problems warmly, and often becomes the emotional center of the episode without replacing Ahmet's role as father."
  rules:
    - "The recurring cast is locked to exactly 16 registered characters unless the owner explicitly approves a permanent cast change."
    - "Do not rename, age-shift, merge, split, replace, redesign or silently remove any locked character."
    - "Keep character appearance, face, hairstyle, identity colors, body proportions, personality, voice and relationships consistent."
    - "Wardrobe may vary only as controlled episode clothing; face, hairstyle, body shape and identity palette remain locked."
    - "Temporary props/accessories may change for story needs but must not become permanent identity changes without approval."
    - "Aden and Kaan live with their mother Esra in Harun and Esma's home."
    - "Ahmet remains Aden and Kaan's father; do not rewrite Harun as their father."
    - "Ahmet is a recurring visitor rather than a constant household character, usually around once a week unless the story needs him."
    - "Harun should frequently be the person who gathers the family, gives confidence, creates solutions or turns tension into a warm ending."
    - "No frightening, sexual, hateful, dangerous-imitation or age-inappropriate content."
    - "Each episode must have a simple educational or social-emotional takeaway."
    - "Avoid copyrighted characters, songs, brands and imitation of living artists."
    - "Prefer reusable sprite/puppet animation; use gpu_special only for visually important shots."

