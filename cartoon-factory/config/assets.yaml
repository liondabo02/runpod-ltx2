asset_contract:
  format: png
  transparent_background: true
  canvas: [1024, 1024]
  required_views: [front, three_quarter, side, back]
  required_emotions: [neutral, happy, sad, angry, surprised, scared, thinking, laughing]
  required_actions: [idle, talk, walk, run, sit, jump, point, wave, hug, carry, kneel]
  mouth_shapes: [X, A, B, C, D, E, F, G]
  naming:
    character_dir: assets/characters/{character_id}
    pose: poses/{action}_{view}.png
    emotion: faces/{emotion}.png
    mouth: mouths/{shape}.png
  lock_policy:
    identity_locked: true
    proportions_locked: true
    signature_features_locked: true
    reference_required_for_all_new_poses: true
    palette_status: "provisional until first approved model sheet, then immutable"

voice_contract:
  sample_rate: 24000
  mono: true
  normalize_lufs: -16
  per_character_voice: true
  multilingual_identity: true
  voice_path: assets/voices/{language}/{character_id}.onnx

