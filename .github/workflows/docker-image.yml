name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: miniverse-ltx2-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test ComfyUI startup
        run: |
          set -euxo pipefail
          docker run --rm \
            -e MINIVERSE_SMOKE_TEST=true \
            -e MODELS_AUTO_DOWNLOAD=false \
            -e PERSIST_MODELS=false \
            -e PERSIST_HF_CACHE=false \
            -e RUNTIME_PRUNE_ENABLED=false \
            -e COMFYUI_HEALTH_RETRIES=90 \
            -e COMFYUI_HEALTH_SLEEP_SECONDS=1 \
            miniverse-ltx2-smoke:ci

      - name: Validate live LTX text encoder node schema
        run: |
          set -euxo pipefail
          cleanup() { docker rm -f miniverse-schema >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name miniverse-schema -p 8188:8188 \
            --entrypoint bash \
            miniverse-ltx2-smoke:ci \
            -lc 'cd /ComfyUI && python3 main.py --cpu --listen 0.0.0.0 --port 8188'
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8188/system_stats >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              docker logs miniverse-schema
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8188/object_info/LTXAVTextEncoderLoader > /tmp/ltx_text_encoder_schema.json
          cat /tmp/ltx_text_encoder_schema.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/ltx_text_encoder_schema.json').read_text())
          node = data.get('LTXAVTextEncoderLoader', data)
          required = set((node.get('input') or {}).get('required') or {})
          optional = set((node.get('input') or {}).get('optional') or {})
          print('required_inputs=', sorted(required))
          print('optional_inputs=', sorted(optional))
          expected_required = {'text_encoder', 'ckpt_name'}
          if not expected_required.issubset(required):
              raise SystemExit(f'Unexpected LTXAVTextEncoderLoader schema: missing {sorted(expected_required - required)}')
          unexpected = required - expected_required
          if unexpected:
              raise SystemExit(f'Unexpected required inputs for LTXAVTextEncoderLoader: {sorted(unexpected)}')
          workflow = json.loads(Path('/opt/ltx2/workflows/image_to_video.json').read_text()) if Path('/opt/ltx2/workflows/image_to_video.json').exists() else None
          PY

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
