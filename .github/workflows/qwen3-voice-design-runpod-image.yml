name: Build Qwen3 VoiceDesign RunPod Image

on:
  push:
    branches:
      - feature/ahos-autopilot
    paths:
      - 'docker/qwen3-voice-design-runpod/**'
      - '.github/workflows/qwen3-voice-design-runpod-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-qwen3-voice-design:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker syntax
        run: python3 -m py_compile docker/qwen3-voice-design-runpod/handler.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Qwen3 VoiceDesign RunPod image
        uses: docker/build-push-action@v6
        with:
          context: docker/qwen3-voice-design-runpod
          file: docker/qwen3-voice-design-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qwen3-voice-design-1.7b-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qwen3-voice-design-1.7b-${{ github.sha }}
          cache-from: type=gha,scope=qwen3-voice-design
          cache-to: type=gha,mode=max,scope=qwen3-voice-design
