name: Build Kokoro RunPod Image

on:
  push:
    branches:
      - feature/ahos-autopilot
    paths:
      - 'docker/kokoro-runpod/**'
      - '.github/workflows/kokoro-runpod-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-kokoro-runpod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate health bridge
        run: |
          python3 -m py_compile docker/kokoro-runpod/health_bridge.py
          sh -n docker/kokoro-runpod/start-runpod.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Kokoro RunPod image
        uses: docker/build-push-action@v6
        with:
          context: docker/kokoro-runpod
          file: docker/kokoro-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:kokoro-runpod-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:kokoro-runpod-${{ github.sha }}
          cache-from: type=gha,scope=kokoro-runpod
          cache-to: type=gha,mode=max,scope=kokoro-runpod
