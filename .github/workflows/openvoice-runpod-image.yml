name: Build OpenVoice RunPod Image

on:
  push:
    branches:
      - feature/ahos-autopilot
    paths:
      - 'docker/openvoice-runpod/**'
      - '.github/workflows/openvoice-runpod-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-openvoice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate worker syntax
        run: python3 -m py_compile docker/openvoice-runpod/handler.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push OpenVoice RunPod image
        uses: docker/build-push-action@v6
        with:
          context: docker/openvoice-runpod
          file: docker/openvoice-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:openvoice-v2-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:openvoice-v2-${{ github.sha }}
          cache-from: type=gha,scope=openvoice-v2
          cache-to: type=gha,mode=max,scope=openvoice-v2
