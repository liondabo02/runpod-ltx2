name: AHOS Media Factory Worker Queue

on:
  push:
    branches:
      - feature/ahos-studio-worker-queue-20261114
    paths:
      - tools/studio_media_queue.py
      - tools/studio_oracle_service.py
      - tests/test_studio_media_queue.py
      - tests/test_media_retry_history.py
      - tests/test_studio_canon_transfer.py
      - tests/test_media_dependency_transfer.py
      - tests/test_studio_scene_plan.py
      - tests/test_studio_media_http.py
      - tests/test_studio_media_worker_client.py
      - tools/studio_media_worker_client.py
      - tools/deploy_media_queue_oracle.py
      - tools/studio_media_objective_qa.py
      - tools/studio_media_multipart.py
      - tests/test_studio_media_multipart.py
      - tests/test_studio_media_multipart_http.py
      - tests/test_media_dependency_transfer.py
      - tests/test_studio_media_objective_qa.py
      - ops/oracle/deploy-media-worker-queue.sh
      - ops/oracle/ahos-studio-os.service
      - tests/test_studio_oracle_service.py
      - .github/workflows/ahos-media-worker-queue.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Install FFmpeg for real media decoding test
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check reversible Oracle deploy script syntax
        run: bash -n ops/oracle/deploy-media-worker-queue.sh
      - name: Compile worker queue and Oracle service
        run: python -m py_compile tools/studio_media_multipart.py tools/studio_media_objective_qa.py tools/studio_media_queue.py tools/studio_media_worker_client.py tools/deploy_media_queue_oracle.py tools/studio_oracle_service.py tools/ahos_studio_os.py
      - name: Validate optional private deployment helper
        run: python tools/deploy_media_queue_oracle.py --help
      - name: Test worker protocol and existing Studio OS
        run: python -m pytest -q tests/test_studio_media_objective_qa.py tests/test_studio_media_multipart.py tests/test_studio_media_multipart_http.py tests/test_studio_media_queue.py tests/test_media_retry_history.py tests/test_studio_canon_transfer.py tests/test_media_dependency_transfer.py tests/test_studio_scene_plan.py tests/test_studio_media_http.py tests/test_studio_media_worker_client.py tests/test_studio_oracle_service.py tests/test_ahos_studio_os.py tests/test_studio_cinematic_router.py tests/test_ltx25_shot_worker.py
      - name: Ensure production status remains honest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path("tools/studio_media_queue.py").read_text()
          assert 'production_ready":False' in t
          cfg=json.loads(Path("studio/pipeline/cinematic-engine-registry.json").read_text())
          assert cfg["new_spend_limit_eur"]==0
          assert all(x["status"]!="VERIFIED_RUNTIME" for x in cfg["providers"].values())
          print("UNVERIFIED_MEDIA_WORKERS_ARE_NOT_ENABLED")
          PY
