name: AHOS Cinematic Safety Gates

on:
  push:
    branches:
      - feature/ahos-studio-cinematic-routing-20261114
    paths:
      - tools/studio_cinematic_router.py
      - tests/test_studio_cinematic_router.py
      - studio/pipeline/cinematic-engine-registry.json
      - .github/workflows/ahos-cinematic-safety.yml

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile source
        run: python -m py_compile tools/studio_cinematic_router.py
      - name: Test source logic and quality gates
        run: python -m pytest -q tests/test_studio_cinematic_router.py tests/test_ahos_studio_os.py
      - name: Check registry is deliberately unverified
        run: |
          python - <<'PY'
          import json
          data=json.load(open('studio/pipeline/cinematic-engine-registry.json'))
          assert data['new_spend_limit_eur']==0
          assert all(v['status']!='VERIFIED_RUNTIME' for v in data['providers'].values())
          print('NO UNVERIFIED PROVIDERS PROMOTED')
          PY
