name: AHOS Heartbeat

# Bilgisayar kapaliyken de calisir: her 30 dakikada bir zihin turu,
# konusma, plan->gorev, egitim ve gunluk rapor uretir.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahos-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kalp atisi
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ahos_core
        run: python -m ahos.heartbeat

      - name: Ozetleri commit et
        run: |
          git config user.name "AHOS Heartbeat"
          git config user.email "heartbeat@ahos.local"
          git add ahos_core/config/heartbeat.json ahos_core/config/report-latest.md ahos_core/config/departments.json ahos_core/config/minds-summary.json ahos_core/config/training-report.json || true
          git diff --staged --quiet || git commit -m "heartbeat: $(date -u +%Y-%m-%dT%H:%M) turu"
          git push || true