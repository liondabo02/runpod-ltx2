name: AHOS Heartbeat

# Github hosted runner 30 dakikada bir AYRI, gecici ortamda calisir.
# Yerel Windows runtime/SQLite ve zihin dosyalarina bagli DEGILDIR.
# Bu workflow PC kapaliyken yerel kuyrugu calistirmaz; yalniz repo raporu uretir.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahos-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kalp atisi
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ahos_core
        run: python -m ahos.heartbeat

      - name: Ozetleri commit et
        run: |
          git config user.name "AHOS Heartbeat"
          git config user.email "heartbeat@ahos.local"
          for file in ahos_core/config/heartbeat.json ahos_core/config/report-latest.md ahos_core/config/departments.json ahos_core/config/minds-summary.json ahos_core/config/training-report.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "heartbeat: $(date -u +%Y-%m-%dT%H:%M) turu"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi