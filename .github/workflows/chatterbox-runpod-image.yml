name: Build Chatterbox Multilingual RunPod Image

on:
  push:
    branches:
      - feature/ahos-autopilot
    paths:
      - 'docker/chatterbox-runpod/**'
      - '.github/workflows/chatterbox-runpod-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-chatterbox-runpod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker syntax
        run: |
          python3 -m py_compile docker/chatterbox-runpod/handler.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Chatterbox RunPod image
        uses: docker/build-push-action@v6
        with:
          context: docker/chatterbox-runpod
          file: docker/chatterbox-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:chatterbox-multilingual-v3-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:chatterbox-multilingual-v3-${{ github.sha }}
          cache-from: type=gha,scope=chatterbox-runpod
          cache-to: type=gha,mode=max,scope=chatterbox-runpod
